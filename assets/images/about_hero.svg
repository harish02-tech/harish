<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADB5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#aboutGrad)"/>

  <!-- Geometric Grid Accent -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Campus / Digital Academy Concept Graphics -->
  <g transform="translate(150, 60)">
    <!-- Central Tower / Academy Emblem -->
    <polygon points="150,30 250,90 250,220 150,280 50,220 50,90" fill="#112240" stroke="#00ADB5" stroke-width="3"/>
    <polygon points="150,60 220,105 220,205 150,250 80,205 80,105" fill="#0A192F" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Light beam from top -->
    <circle cx="150" cy="155" r="45" fill="url(#glowTeal)" opacity="0.85"/>
    <polygon points="150,125 175,175 125,175" fill="#0B192C"/>
    <circle cx="150" cy="160" r="10" fill="#FFFFFF"/>

    <!-- Floating Mission Badges -->
    <g transform="translate(-90, 80)">
      <rect width="120" height="45" rx="8" fill="#1E293B" stroke="#00ADB5" stroke-width="1.5"/>
      <text x="60" y="27" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">🎓 Accreditation</text>
    </g>
    <g transform="translate(260, 80)">
      <rect width="130" height="45" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="65" y="27" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">⚡ Industry Mentors</text>
    </g>
    <g transform="translate(-50, 240)">
      <rect width="140" height="45" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <text x="70" y="27" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">🌍 Global Community</text>
    </g>
    <g transform="translate(220, 240)">
      <rect width="140" height="45" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="70" y="27" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">🚀 Career Acceleration</text>
    </g>
  </g>
</svg>
