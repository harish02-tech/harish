<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADB5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  <rect width="600" height="360" fill="url(#gridPattern1)"/>

  <!-- Glowing background elements -->
  <circle cx="480" cy="80" r="120" fill="#00ADB5" opacity="0.15" filter="blur(40px)"/>
  <circle cx="120" cy="280" r="140" fill="#0284C7" opacity="0.12" filter="blur(50px)"/>

  <!-- Code Editor Window -->
  <g transform="translate(60, 45)">
    <!-- Window Frame -->
    <rect width="480" height="270" rx="12" fill="#091220" stroke="#334155" stroke-width="1.5"/>
    <rect width="480" height="36" rx="12" fill="#0f1f38"/>
    <path d="M 0 36 L 480 36" stroke="#1e293b" stroke-width="1"/>
    <!-- Window Controls -->
    <circle cx="22" cy="18" r="5" fill="#EF4444"/>
    <circle cx="38" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="18" r="5" fill="#10B981"/>
    <!-- Tab -->
    <rect x="80" y="8" width="130" height="28" rx="6" fill="#091220"/>
    <text x="96" y="26" font-family="'Courier New', monospace" font-size="12" fill="#94A3B8">index.html</text>

    <!-- Code Line Graphics -->
    <text x="30" y="70" font-family="'Courier New', monospace" font-size="13" fill="#F43F5E">&lt;!DOCTYPE html&gt;</text>
    <text x="30" y="94" font-family="'Courier New', monospace" font-size="13" fill="#38BDF8">&lt;html <tspan fill="#F59E0B">lang=</tspan><tspan fill="#10B981">"en"</tspan>&gt;</text>
    <text x="50" y="118" font-family="'Courier New', monospace" font-size="13" fill="#38BDF8">&lt;header <tspan fill="#F59E0B">class=</tspan><tspan fill="#10B981">"app-header"</tspan>&gt;</text>
    <text x="70" y="142" font-family="'Courier New', monospace" font-size="13" fill="#E2E8F0">&lt;h1&gt;<tspan fill="#00ADB5">LearnSphere FullStack</tspan>&lt;/h1&gt;</text>
    <text x="50" y="166" font-family="'Courier New', monospace" font-size="13" fill="#38BDF8">&lt;/header&gt;</text>
    
    <text x="50" y="196" font-family="'Courier New', monospace" font-size="13" fill="#A855F7">&lt;?php</text>
    <text x="70" y="220" font-family="'Courier New', monospace" font-size="13" fill="#E2E8F0">$pdo = <tspan fill="#F59E0B">new</tspan> PDO($dsn, $user);</text>
    <text x="70" y="244" font-family="'Courier New', monospace" font-size="13" fill="#E2E8F0">$stmt-&gt;<tspan fill="#38BDF8">execute</tspan>([<tspan fill="#00ADB5">':status'</tspan> =&gt; <tspan fill="#10B981">'Active'</tspan>]);</text>
    <text x="50" y="268" font-family="'Courier New', monospace" font-size="13" fill="#A855F7">?&gt;</text>

    <!-- Tech Badges Floating -->
    <g transform="translate(320, 60)">
      <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#00ADB5" stroke-width="1.5"/>
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00ADB5" text-anchor="middle">HTML5 &amp; CSS3</text>
    </g>
    <g transform="translate(320, 105)">
      <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F59E0B" text-anchor="middle">JavaScript ES6</text>
    </g>
    <g transform="translate(320, 150)">
      <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C084FC" text-anchor="middle">PHP 8.2 Engine</text>
    </g>
    <g transform="translate(320, 195)">
      <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
      <text x="65" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">MySQL Relational</text>
    </g>
  </g>
</svg>
