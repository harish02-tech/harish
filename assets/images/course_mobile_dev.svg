<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B2A"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#mobBg)"/>
  
  <!-- Centered Smartphone Outline -->
  <g transform="translate(225, 30)">
    <!-- Phone Bezel -->
    <rect width="150" height="300" rx="24" fill="#030712" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Screen Notch/Island -->
    <rect x="50" y="8" width="50" height="12" rx="6" fill="#111827"/>
    <circle cx="85" cy="14" r="2.5" fill="#38BDF8"/>
    <!-- Screen Content -->
    <rect x="8" y="26" width="134" height="260" rx="16" fill="#0F172A"/>
    
    <!-- Mini App Header -->
    <rect x="18" y="40" width="70" height="10" rx="3" fill="#38BDF8"/>
    <circle cx="128" cy="45" r="7" fill="#00ADB5"/>
    
    <!-- App Banner -->
    <rect x="18" y="60" width="114" height="50" rx="8" fill="#1E293B" stroke="#00ADB5" stroke-width="1"/>
    <circle cx="36" cy="85" r="10" fill="#38BDF8"/>
    <rect x="52" y="78" width="65" height="6" rx="2" fill="#E2E8F0"/>
    <rect x="52" y="88" width="45" height="5" rx="2" fill="#64748B"/>

    <!-- App Cards -->
    <rect x="18" y="120" width="52" height="65" rx="6" fill="#1E293B"/>
    <circle cx="44" cy="142" r="12" fill="#0284C7"/>
    <rect x="25" y="162" width="38" height="5" rx="2" fill="#94A3B8"/>

    <rect x="80" y="120" width="52" height="65" rx="6" fill="#1E293B"/>
    <circle cx="106" cy="142" r="12" fill="#10B981"/>
    <rect x="87" y="162" width="38" height="5" rx="2" fill="#94A3B8"/>

    <!-- Bottom Nav -->
    <rect x="18" y="255" width="114" height="24" rx="12" fill="#1E293B"/>
    <circle cx="40" cy="267" r="4" fill="#38BDF8"/>
    <circle cx="75" cy="267" r="4" fill="#64748B"/>
    <circle cx="110" cy="267" r="4" fill="#64748B"/>
  </g>

  <!-- Left Platform Badge: iOS -->
  <g transform="translate(70, 140)">
    <rect width="115" height="55" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="57" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Apple iOS</text>
    <text x="57" y="44" font-family="sans-serif" font-size="10" fill="#38BDF8" text-anchor="middle">Swift &amp; Cupertino</text>
  </g>

  <!-- Right Platform Badge: Android -->
  <g transform="translate(415, 140)">
    <rect width="115" height="55" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="57" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Android OS</text>
    <text x="57" y="44" font-family="sans-serif" font-size="10" fill="#10B981" text-anchor="middle">Material 3 Engine</text>
  </g>
</svg>
