<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADB5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#cyberBg)"/>
  
  <!-- Cyber Matrix grid and target circles -->
  <circle cx="300" cy="170" r="130" fill="none" stroke="#00ADB5" stroke-width="1" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="300" cy="170" r="95" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>

  <!-- Shield Shape -->
  <g transform="translate(235, 80)">
    <path d="M 65 10 
             L 125 35 
             L 125 100 
             C 125 150, 65 180, 65 180 
             C 65 180, 5 150, 5 100 
             L 5 35 Z" 
          fill="url(#shieldGrad)" opacity="0.95"/>
    <!-- Padlock Graphic inside Shield -->
    <path d="M 45 75 L 45 60 C 45 48, 85 48, 85 60 L 85 75" fill="none" stroke="#050C1A" stroke-width="7" stroke-linecap="round"/>
    <rect x="35" y="75" width="60" height="45" rx="8" fill="#050C1A"/>
    <circle cx="65" cy="94" r="5" fill="#00ADB5"/>
    <path d="M 65 99 L 65 107" stroke="#00ADB5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Hexagonal Alert Badges -->
  <g transform="translate(80, 80)">
    <rect width="130" height="40" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    <text x="65" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F87171" text-anchor="middle">FIREWALL: ACTIVE</text>
  </g>
  <g transform="translate(80, 240)">
    <rect width="140" height="40" rx="6" fill="#1E293B" stroke="#00ADB5" stroke-width="1.5"/>
    <text x="70" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">ENCRYPTION: AES-256</text>
  </g>
  <g transform="translate(390, 80)">
    <rect width="130" height="40" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="65" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">OWASP AUDIT: PASS</text>
  </g>
  <g transform="translate(390, 240)">
    <rect width="130" height="40" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="65" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="middle">PENTEST: ZERO CVE</text>
  </g>
</svg>
