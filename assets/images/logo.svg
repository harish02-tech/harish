<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADB5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00ADB5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sphere & Academic Cap Icon -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <circle cx="24" cy="24" r="22" fill="#0B192C" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <!-- Orbital Rings -->
    <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#00ADB5" stroke-width="1.5" fill="none" transform="rotate(-25 24 24)" opacity="0.8"/>
    <!-- Graduation Cap Symbol -->
    <path d="M24 14 L36 20 L24 26 L12 20 Z" fill="url(#logoGrad)"/>
    <path d="M17 22.5 V28.5 C17 32 31 32 31 28.5 V22.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M36 20 V27" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="36" cy="28" r="1.5" fill="#38BDF8"/>
  </g>
  
  <!-- Brand Text -->
  <text x="64" y="34" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="24" font-weight="800" fill="#0B192C" letter-spacing="-0.5">
    Learn<tspan fill="#00ADB5">Sphere</tspan>
  </text>
  <text x="65" y="48" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="2">
    ACADEMIC COURSE PORTAL
  </text>
</svg>
