<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#2D2B55"/>
    </linearGradient>
    <linearGradient id="accentUi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#uiBg)"/>
  
  <!-- Canvas Workspace Mockup -->
  <g transform="translate(60, 45)">
    <!-- Device Frame -->
    <rect width="480" height="270" rx="14" fill="#181825" stroke="#45475A" stroke-width="2"/>
    <!-- Top toolbar -->
    <rect width="480" height="32" rx="14" fill="#11111B"/>
    <circle cx="20" cy="16" r="4.5" fill="#F38BA8"/>
    <circle cx="35" cy="16" r="4.5" fill="#F9E2AF"/>
    <circle cx="50" cy="16" r="4.5" fill="#A6E3A1"/>

    <!-- Left Artboard -->
    <rect x="25" y="50" width="180" height="195" rx="8" fill="#1E1E2E" stroke="#585B70" stroke-width="1"/>
    <!-- Wireframe blocks -->
    <rect x="40" y="65" width="150" height="24" rx="4" fill="#313244"/>
    <rect x="40" y="98" width="60" height="50" rx="4" fill="#45475A"/>
    <rect x="110" y="98" width="80" height="12" rx="3" fill="#313244"/>
    <rect x="110" y="118" width="60" height="10" rx="3" fill="#313244"/>
    <rect x="110" y="136" width="40" height="12" rx="6" fill="#00ADB5"/>
    
    <rect x="40" y="160" width="150" height="65" rx="6" fill="#24273A" stroke="#45475A" stroke-width="1"/>
    <circle cx="65" cy="192" r="14" fill="#89B4FA"/>
    <rect x="90" y="180" width="80" height="10" rx="3" fill="#6C7086"/>
    <rect x="90" y="196" width="50" height="8" rx="2" fill="#45475A"/>

    <!-- Right Component Library -->
    <rect x="225" y="50" width="230" height="195" rx="8" fill="#1E1E2E" stroke="#585B70" stroke-width="1"/>
    <!-- Design System Tokens -->
    <text x="245" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#CDD6F4">Design System Tokens</text>
    
    <!-- Color Swatches -->
    <circle cx="255" cy="100" r="10" fill="#00ADB5"/>
    <circle cx="285" cy="100" r="10" fill="#F43F5E"/>
    <circle cx="315" cy="100" r="10" fill="#89B4FA"/>
    <circle cx="345" cy="100" r="10" fill="#A6E3A1"/>
    <circle cx="375" cy="100" r="10" fill="#F9E2AF"/>

    <!-- Button Component States -->
    <rect x="245" y="125" width="95" height="28" rx="6" fill="#00ADB5"/>
    <text x="292" y="143" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0B192C" text-anchor="middle">Primary Btn</text>

    <rect x="350" y="125" width="90" height="28" rx="6" fill="transparent" stroke="#00ADB5" stroke-width="1.5"/>
    <text x="395" y="143" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00ADB5" text-anchor="middle">Secondary</text>

    <!-- Interactive Toggle -->
    <rect x="245" y="170" width="48" height="22" rx="11" fill="#10B981"/>
    <circle cx="280" cy="181" r="8" fill="#FFFFFF"/>
    <text x="305" y="185" font-family="sans-serif" font-size="11" fill="#BAC2DE">Auto-Layout 5.0</text>
  </g>
</svg>
